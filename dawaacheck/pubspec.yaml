name: dawaacheck
description: "Pakistan's First AI-Powered Medicine Verification App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase & Auth
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  google_sign_in: ^6.2.1

  # Database
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3
  connectivity_plus: ^6.0.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Camera
  camera: ^0.11.0
  image: ^4.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1

  # Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  skeletonizer: ^2.1.3
  animations: ^2.1.1

  # Typography
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Localization
  easy_localization: ^3.0.7
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  uuid: ^4.4.2
  equatable: ^2.0.5
  flutter_svg: ^2.0.10
  phosphor_flutter: ^2.1.0
  iconsax_flutter: ^1.0.0
  flutter_native_splash: ^2.4.7
  flutter_staggered_animations: ^1.1.1
  animated_digit: ^3.3.2

  # App Branding
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dawacheck_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/dawacheck_logo.png"

flutter_native_splash:
  color: "#F4F8FF"
  color_dark: "#0C1825"
  image: "assets/icons/dawacheck_logo.png"
  android_12:
    color: "#F4F8FF"
    color_dark: "#0C1825"
    image: "assets/icons/dawacheck_logo.png"
  web: true
  web_image_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/translations/
    - assets/fonts/
    - assets/reference_packs/
